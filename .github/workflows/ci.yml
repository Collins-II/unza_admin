name: Release checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ci-build-only-not-a-deployment-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:bookings
      - run: npm run test:academics
      - run: npm run test:governance
      - run: npm run build
